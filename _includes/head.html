<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="description" content="Software development satire in a web comic." />


  <meta name="p:domain_verify" content="abaa2ec346dca8ee5f637f4ddc6ca5db"/>
  <title>{% if page.title %}{{ page.title }}{% else %}{{ site.name }}{% endif %}</title>

  <!-- CSS -->
  <link rel="stylesheet" href="{{ site.baseurl }}/assets/css/main.css" type="text/css">
  <link rel="stylesheet" href="{{ site.baseurl }}/assets/css/stylesheet.css" type="text/css">

  <link rel="apple-touch-icon" sizes="180x180" href="/apple-touch-icon.png">
  <link rel="icon" type="image/png" href="/favicon-32x32.png" sizes="32x32">
  <link rel="icon" type="image/png" href="/favicon-16x16.png" sizes="16x16">
  <link rel="manifest" href="/manifest.json">
  <link rel="mask-icon" href="/safari-pinned-tab.svg" color="#5bbad5">
  <meta name="theme-color" content="#ffffff">
  <link rel="alternate" type="application/rss+xml" title="RSS Feed for {{ site.name }}" href="{{ site.baseurl }}/feed.xml" />


  <meta property="og:site_name" content="{{ site.name }}">
  <meta property="og:type" content="article" >

  <meta name="twitter:card" content="summary">

  {% if site.author.twitter %}
  <meta name="twitter:site" content="@{{ site.author.twitter }}">
  <meta name="twitter:creator" content="@{{ site.author.twitter }}">
  {% endif %}

  {% if page.title %}
    <meta name="twitter:title" content="{{ page.title }}">
    <meta content="{{ page.title }}" property="og:title">
  {% else %}
    <meta name="twitter:title" content="{{ site.title }}">
    <meta content="{{ site.title }}" property="og:title">
  {% endif %}

  {% if page.url %}
    <meta name="twitter:url" content="{{ site.url }}{{ page.url }}">
    <meta property="og:url" content="{{ site.url }}{{ page.url }}">
  {% endif %}

  {% if page.description %}
  <meta name="twitter:description" content="{{ page.description }}">
  <meta property="og:description" content="{{ page.description }}">
  {% else %}
  <meta name="twitter:description" content="{{ site.description }}">
  <meta property="og:description" content="{{ site.description }}">
  {% endif %}

  {% if page.image %}
    <meta name="twitter:image:src" content="{{ site.url }}/assets/images/{{ page.image }}">
    <meta property="og:image" content="{{ site.url }}/assets/images/{{ page.image }}" />
  {% else %}
    <meta name="twitter:image:src" content="{{ site.url }}/assets/images/1 - minor bug.png">
    <meta property="og:image" content="{{ site.url }}/assets/images/{{site.posts.first.image}}" />
  {% endif %}



  {% include google-analytics.html %}
  {% include facebook-pixel.html %}


  <script>
    var posts = [];
    var images = [];
    var titles = [];
    var positions = [];
    var prev, next;

    {% for post in site.posts %}

    {% unless post.title contains 'AdLitteram' %}
    posts.push("{{ post.url }}");
    images.push("{{post.image}}");
    titles.push("{{post.title}}");
    positions.push("{{post.position}}");

    {% endunless %}

    {% endfor %}



    {% if page.previous.url %}
    prev = "{{ site.baseurl }}{{page.previous.url}}"
    {% endif %}

    {% if page.next.url  %}
    next = "{{ site.baseurl }}{{page.next.url}}"
    {% endif %}

  </script>
  <script>
    function swipedetect(el, callback) {

      var touchsurface = el,
              swipedir,
              startX,
              startY,
              distX,
              distY,
              threshold = 100, //required min distance traveled to be considered swipe
              restraint = 100, // maximum distance allowed at the same time in perpendicular direction
              allowedTime = 400, // maximum time allowed to travel that distance
              elapsedTime,
              startTime,
              handleswipe = callback || function (swipedir) {
                      }

      touchsurface.addEventListener('touchstart', function (e) {
        var touchobj = e.changedTouches[0]
        swipedir = 'none'
        dist = 0
        startX = touchobj.pageX
        startY = touchobj.pageY
        startTime = new Date().getTime()
      }, false)

      touchsurface.addEventListener('touchend', function (e) {
        var touchobj = e.changedTouches[0]
        distX = touchobj.pageX - startX // get horizontal dist traveled by finger while in contact with surface
        distY = touchobj.pageY - startY // get vertical dist traveled by finger while in contact with surface
        elapsedTime = new Date().getTime() - startTime // get time elapsed
        if (elapsedTime <= allowedTime) { // first condition for awipe met
          if (Math.abs(distX) >= threshold && Math.abs(distY) <= restraint) { // 2nd condition for horizontal swipe met
            swipedir = (distX < 0) ? 'left' : 'right' // if dist traveled is negative, it indicates left swipe
          }
          else if (Math.abs(distY) >= threshold && Math.abs(distX) <= restraint) { // 2nd condition for vertical swipe met
            swipedir = (distY < 0) ? 'up' : 'down' // if dist traveled is negative, it indicates up swipe
          }
        }
        handleswipe(swipedir)
      }, false)
    }

    var el = document;
    swipedetect(el, function (swipedir) {
      if (swipedir === 'right' && prev) {
        window.location.href = prev;
      } else if (swipedir === 'left' && next) {
        window.location.href = next;
      }
    })
  </script>

</head>
