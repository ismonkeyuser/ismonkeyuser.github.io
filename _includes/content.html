<span class="post-date">
    <time>{{ page.date | date_to_string }}</time>
    <span class="tags">
        {% for tag in page.tags %}

        <a href="{{ site.url }}/tags#{{ tag }}" class="tag">
            <span class="term">{{ tag }}</span>
        </a>

        {% unless forloop.last %}{% endunless %}
        {% endfor %}
    </span>
</span>

<div class="content">
    {{ content }}
</div>

{% if page.reveal %}
<div class="center">
    <div id="reveal" class="reveal" onclick="reveal()">Reveal</div>
</div>
<script>
    function reveal() {
        document.getElementById('reveal').innerHTML = "Answer: {{page.reveal}}";
        document.getElementById('reveal').className += ' answered';
    }
</script>
{% else %}
{% if page.title contains "AdLitteram" %}
<div class="center">
    The response for the riddle will be published on Monday<br>
</div>
{% endif %}
{% endif %}
