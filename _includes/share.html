<div class="center">
    <span>Share this comic: </span>

    <span class="fb-like"
          data-href="{{ site.url }}{{ page.url }}"
          data-layout="button_count"
          data-action="like"
          data-share="true"
          data-size="large"
          data-show-faces="true">
    </span>
    <span class="ssk-group ssk-sm">
        <a href="https://twitter.com/intent/tweet?text={{ page.title | uri_escape }}%20via%20@ismonkeyuser:&url={{ site.url }}{{ page.url }}"
           class="ssk ssk-twitter"></a>
        <a href="https://plus.google.com/share?url={{ site.url }}{{ page.url }}"
           onclick="window.open(this.href, 'mywin', 'left=20,top=20,width=500,height=500,toolbar=1,resizable=0'); return false;"
           class="ssk ssk-google-plus"></a>
        <a href="https://www.reddit.com/submit" class="ssk ssk-reddit2"
           onclick="window.location = '//www.reddit.com/submit?url=' + encodeURIComponent(window.location); return false"></a>
        <a href="mailto:?subject={{ page.title }}&amp;body=Check out this site {{ site.url }}{{ page.url }}"
           class="ssk ssk-email"></a>
    </span>
</div>
<hr>
{% include navigation.html %}
<hr>
<div class="center">
    <img src="/assets/images/promo.png" alt="Promo" title="Promo">
    <a class="fb-like"
       style="line-height: 10px;"
       data-href="https://www.facebook.com/ismonkeyuser/"
       data-layout="button_count"
       data-action="like"
       data-size="large"
       data-show-faces="true">
    </a>
    <a class="twitter-follow-button"
       data-show-screen-name="false"
       data-size="large"
       href="https://twitter.com/ismonkeyuser"></a>
    <script src="https://apis.google.com/js/platform.js" async defer></script>
    <span style="position: relative; top: -2px;">
        <div class="g-follow" data-annotation="bubble" data-height="24"
             data-href="//plus.google.com/u/1/108994964581744807930" data-rel="author"></div>
    </span>
</div>
