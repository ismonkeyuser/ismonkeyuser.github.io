<div class="center">
    <span>Share this comic: </span>

    <span class="fb-like"
          style="line-height: 16px;"
          data-href="{{ site.url }}{{ page.url }}"
          data-layout="button_count"
          data-action="like"
          data-share="true"
          data-show-faces="true">
    </span>

    <a href="https://twitter.com/intent/tweet?text=@ismonkeyuser: {{ page.title }} &url={{ site.url }}{{ page.url }}"
       class="ssk ssk-icon ssk-twitter"></a>


    <a href="//www.reddit.com/submit"
       onclick="window.location = '//www.reddit.com/submit?url=' + encodeURIComponent(window.location); return false">
        <img src="//www.redditstatic.com/spreddit5.gif" alt="submit to reddit" border="0" style="display:inline-block"/>
    </a>


    <a href="https://plus.google.com/share?url={{ site.url }}{{ page.url }}" onclick="window.open(this.href, 'mywin',
    'left=20,top=20,width=500,height=500,toolbar=1,resizable=0'); return false;" class="ssk ssk-icon ssk-google-plus"></a>
    <a href="https://www.tumblr.com/share?url={{ site.url }}{{ page.url }}" onclick="window.open(this.href, 'mywin',
    'left=20,top=20,width=500,height=500,toolbar=1,resizable=0'); return false;" class="ssk ssk-icon ssk-tumblr"></a>
    <a href="mailto:?subject={{ page.title }}&amp;body=Check out this site {{ site.url }}{{ page.url }}"
       class="ssk ssk-icon ssk-email"></a>
</div>
<hr>

       href="https://twitter.com/ismonkeyuser">
        Follow @ismonkeyuser</a>

    <!-- Place this tag in your head or just before your close body tag. -->

    |

    <a  href="https://www.reddit.com/r/monkeyuser/" target="_blank">
        <img src="//www.redditstatic.com/spreddit5.gif" alt="submit to reddit" border="0" style="display: inline-block;"/>
    </a>

    |

</div>
