<div class="page-navigation">
    <script>
        var posts = [];
        var prev, next;

        {% for post in site.posts %}
            posts.push("{{ post.url }}");
        {% endfor %}

        {% if page.previous.url %}
            prev = "{{ site.baseurl }}{{page.previous.url}}"
        {% endif %}

        {% if page.next.url  %}
            next = "{{ site.baseurl }}{{page.next.url}}"
        {% endif %}

    </script>


    {% if page.previous.url %}
    <script>
        document.write('<a class="sprite sprite-first" title="first" href="' + posts[posts.length - 1] + '"></a>');
    </script>

    <a class="sprite sprite-previous" title="previous" href="{{ site.baseurl }}{{page.previous.url}}"></a>
    {% else %}
    <script>
        document.write('<a title="first" class="sprite sprite-disabled sprite-first"></a>');
    </script>

    <a title="previous" class="sprite sprite-disabled sprite-previous"></a>
    {% endif %}


    <script>
        document.write("<a title=\"random\" class=\"random sprite sprite-random\" href=\"");
        document.write(posts[Math.floor(Math.random() * posts.length)]);
        document.write("\"></a>");
    </script>

    {% if page.next.url %}
    <a title="next" class="next sprite sprite-next" href="{{ site.baseurl }}{{page.next.url}}"></a>
    <script>
        document.write('<a title=\"last\" class="sprite sprite-last" href="' + posts[0] + '"></a>');
    </script>
    {% else %}
    <a title="next" class="next sprite sprite-disabled sprite-next"></a>
    <script>
        document.write('<a title=\"last\" class="sprite sprite-disabled sprite-last" ></a>');
    </script>
    {% endif %}


    <span class="clearfix"></span>

    <script>
        function swipedetect(el, callback){

            var touchsurface = el,
            swipedir,
            startX,
            startY,
            distX,
            distY,
            threshold = 50, //required min distance traveled to be considered swipe
            restraint = 100, // maximum distance allowed at the same time in perpendicular direction
            allowedTime = 500, // maximum time allowed to travel that distance
            elapsedTime,
            startTime,
            handleswipe = callback || function(swipedir){}

            touchsurface.addEventListener('touchstart', function(e){
                var touchobj = e.changedTouches[0]
                swipedir = 'none'
                dist = 0
                startX = touchobj.pageX
                startY = touchobj.pageY
                startTime = new Date().getTime()
            }, false)

            touchsurface.addEventListener('touchend', function(e){
                var touchobj = e.changedTouches[0]
                distX = touchobj.pageX - startX // get horizontal dist traveled by finger while in contact with surface
                distY = touchobj.pageY - startY // get vertical dist traveled by finger while in contact with surface
                elapsedTime = new Date().getTime() - startTime // get time elapsed
                if (elapsedTime <= allowedTime){ // first condition for awipe met
                    if (Math.abs(distX) >= threshold && Math.abs(distY) <= restraint){ // 2nd condition for horizontal swipe met
                        swipedir = (distX < 0)? 'left' : 'right' // if dist traveled is negative, it indicates left swipe
                    }
                    else if (Math.abs(distY) >= threshold && Math.abs(distX) <= restraint){ // 2nd condition for vertical swipe met
                        swipedir = (distY < 0)? 'up' : 'down' // if dist traveled is negative, it indicates up swipe
                    }
                }
                handleswipe(swipedir)
            }, false)
        }

        var el = document;
        swipedetect(el, function(swipedir){
            if (swipedir === 'right' && prev){
                window.location.href = prev;
            } else if (swipedir === 'left' && next) {
                window.location.href = next;
            }
        })
    </script>
</div>
