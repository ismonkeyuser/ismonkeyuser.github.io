<div class="page-navigation">
    {% if page.previous.url %}
        <a class="prev sprite sprite-previous" href="{{ site.baseurl }}{{page.previous.url}}"></a>
    {% else %}
        <a class="prev sprite sprite-previous disabled">Previous</a>
    {% endif %}


    <script>
        var posts = [];
        {% for post in site.posts %}
        posts.push("{{ post.url }}");
        {% endfor %}
        document.write("<a class=\"random sprite sprite-random\" href=\"");
        document.write(posts[Math.floor(Math.random() * posts.length)]);
        document.write("\"></a>");
    </script>

    {% if page.next.url %}
        <a class="next sprite sprite-next" href="{{ site.baseurl }}{{page.next.url}}"></a>
    {% else %}
        <a class="next sprite sprite-next disabled"></a>
    {% endif %}
    <span class="clearfix"></span>
</div>
