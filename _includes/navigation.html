<div class="page-navigation">
    {% if page.previous.url %}
    <a class="prev" href="{{ site.baseurl }}{{page.previous.url}}">Previous</a>
    {% endif %}


    <script>
        var posts = [];
        {% for post in site.posts %}
        posts.push("{{ post.url }}");
        {% endfor %}
        document.write("<a class=\"random\" href=\"");
        document.write(posts[Math.floor(Math.random() * posts.length)]);
        document.write("\">Random</a>");
    </script>

    {% if page.next.url %}
    <a class="next" href="{{ site.baseurl }}{{page.next.url}}">Next</a>
    {% endif %}
    <span class="clearfix"></span>
</div>
