<div class="page-navigation">
    <script>
        var posts = [];
        {% for post in site.posts %}
            posts.push("{{ post.url }}");
        {% endfor %}


    </script>


    {% if page.previous.url %}
    <script>
        document.write('<a class="sprite sprite-first" href="' + posts[posts.length - 1] + '"></a>');
    </script>

    <a class="sprite sprite-previous" href="{{ site.baseurl }}{{page.previous.url}}"></a>
    {% else %}
    <script>
        document.write('<a class="sprite sprite-disabled sprite-first"></a>');
    </script>

    <a class="sprite sprite-disabled sprite-previous"></a>
    {% endif %}


    <script>
        document.write("<a class=\"random sprite sprite-random\" href=\"");
        document.write(posts[Math.floor(Math.random() * posts.length)]);
        document.write("\"></a>");
    </script>

    {% if page.next.url %}
    <a class="next sprite sprite-next" href="{{ site.baseurl }}{{page.next.url}}"></a>
    <script>
        document.write('<a class="sprite sprite-last" href="' + posts[0] + '"></a>');
    </script>
    {% else %}
    <a class="next sprite sprite-disabled sprite-next"></a>
    <script>
        document.write('<a class="sprite sprite-disabled sprite-last" ></a>');
    </script>
    {% endif %}


    <span class="clearfix"></span>
</div>
