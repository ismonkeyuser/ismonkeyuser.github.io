<script id="test">
    var Key = {
        LEFT: 37,
        UP: 38,
        RIGHT: 39,
        DOWN: 40
    };
    /**
 * old IE: attachEvent
 * Firefox, Chrome, or modern browsers: addEventListener
 */
    function _addEventListener(evt, element, fn) {
        if (window.addEventListener) {
            element.addEventListener(evt, fn, false);
        } else {
            element.attachEvent('on' + evt, fn);
        }
    }
    if (window.location.href.indexOf('sc=true') !== -1) {
        var elmnt = document.querySelector(".tags");
        window.onload = function () {
            elmnt.scrollIntoView();
        }
    }
    function handleKeyboardEvent(evt) {
        if (!evt) {
            evt = window.event;
        } // for old IE compatible
        var keycode = evt.keyCode || evt.which; // also for cross-browser compatible
        switch (keycode) {
                {% if page.previous.url %}
                case Key.LEFT:
                    window.location = '{{page.previous.url}}?sc=true';
                    break;
                {% endif %}
                {% if page.previous.url %}
                case Key.RIGHT:
                    window.location = '{{page.next.url}}?sc=true';
                    break;
                {% endif %}
        }
    }
    _addEventListener('keydown', document, handleKeyboardEvent);
</script>
