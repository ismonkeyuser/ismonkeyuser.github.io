<header class="header">
  <div class="center">
    <h1 class="header-title">
      <a href="/">&#x1f435;{{ site.name }}.com</a>
    </h1>
    {% if site.author.news %}
    <div class="news">{{ site.author.news }}</div>
    {% else %}
    <small>
     {{site.author.subtitle}}
    </small>
    {% endif %}
  </div>
  <nav class="header-nav">
    {% for nav in site.nav %}
    {% if nav.url contains 'http://' or nav.url contains 'https://' %}
    <a href="{{ nav.url }}">{{ nav.name }}</a>
    {% else %}
    <a href="{{ nav.url | prepend: site.baseurl }}">{{ nav.name }}</a>
    {% endif %}
    {% endfor %}
  </nav>
</header>
