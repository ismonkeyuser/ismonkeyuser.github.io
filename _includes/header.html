<header class="content-container header">
    <div class="center">
        <h2 class="header-title">
            <div class="logo"></div>
            <a href="/">{{ site.name }}.com</a>
        </h2>
        <!-- <div> var menu = [ <a href="/">"home"</a>, <a href="/toc">"list"</a>, <a href="/about/index.html">"about"</a> ];
        </div> -->
        <div class="text-center social-links">
            <a href="/toc" id="list">COMICS LIST</a>
            <a href="https://ismonkeyuser.myshopify.com" style='color:#05A7FF;'>🛒SHOP</a>
            <a href="/about/index.html">ABOUT</a>
        </div>
        <div class="text-center social-links">
            <a href="https://twitter.com/ismonkeyuser" target="_blank">TWITTER</a>
            <a href="https://facebook.com/ismonkeyuser" target="_blank">FACEBOOK</a>
            <a href="https://instagram.com/themonkeyuser" target="_blank">INSTAGRAM</a>
            <!-- <a href="https://www.tumblr.com/blog/ismonkeyuser" target="_blank">TUMBLR</a> -->
        </div>
        {% if site.author.news %}
            <div class="news">{{ site.author.news }}</div>
        {% endif %}
    </div>
    <nav class="header-nav">
        {% for nav in site.nav %}
            {% if nav.url contains 'http://' or nav.url contains 'https://' %}
                <a href="{{ nav.url }}">{{ nav.name }}</a>
            {% else %}
                <a href="{{ nav.url | prepend: site.baseurl }}">{{ nav.name }}</a>
            {% endif %}
        {% endfor %}
    </nav>
</header>
