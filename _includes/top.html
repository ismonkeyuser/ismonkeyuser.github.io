<div id="top_comics" style="display: none;">
    <div class="center">Random comics:</div>
    <div class="top">
        <script>
            try {
                var selected = [];
                while (selected.length < 5) {
                    var index = Math.round(Math.random() * posts.length);
                    if (selected.indexOf(index) === -1 && posts[index] && images[index] && titles[index] && titles[index].toLowerCase().indexOf('litteram') === -1) {
                        selected.push(index);
                        document.write('<a class="thumb" title="' + titles[index] + '" style="background-image: url(/assets/images/' + images[index] + ')" href="' + posts[index] + '"></a>')
                    }
                }
            } catch(e) {
                console.log(e);
            }
        </script>
    </div>
</div>
