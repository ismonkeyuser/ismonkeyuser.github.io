# # # # # # # # # # # # #
#     Le MonkeyUser     #
# # # # # # # # # # # # #

# Basic
name:               "MonkeyUser"
description:        "Software development satire"
version:            3

author:
  name:             Monkey User
  twitter:          ismonkeyuser
  facebook:         ismonkeyuser
  instagram:        themonkeyuser
  email:            ismonkeyuser@gmail.com
  subtitle:         "Become a patron"
  news:             Buy Plushies


# Google-analytics
google-analytics:
  id:               "UA-85826815-1"

# Disqus
#disqus:
#  id:               "monkeyuser"

# URL
url:                "https://www.monkeyuser.com"
#url:               "localhost:4000"
baseurl:            ""


# http://en.wikipedia.org/wiki/List_of_tz_database_time_zones
timezone:           Europe/Bucharest
permalink:          /:year/:title/

# Pagination
paginate:           5
paginate_path:      /page:num/

# Markdown
markdown:           kramdown
kramdown:
  imput:            GFM

# Navigation
#nav:
#  - name:           "About"
#    url:            "/about"


# Sass
sass:
  sass_dir:         _sass
  style:            :compressed

# Scopes
defaults:
  -
    scope:
      path:         ""
      type:         "pages"
    values:
      layout:       "page"
  -
    scope:
      path:         ""
      type:         "posts"
    values:
      layout:       "post"
  -
    scope:
      path:            "**/google*.html"
    values:
      sitemap:         false

# jekyll-seo-tag, see: http://www.rubydoc.info/gems/jekyll-seo-tag/1.2.0
plugins:
  - jekyll-seo-tag
  - jekyll-paginate
  - jekyll-sitemap

exclude:            [vendor]
include:            [.well-known]
