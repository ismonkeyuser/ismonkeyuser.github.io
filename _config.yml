# # # # # # # # # # # # #
#     Le MonkeyUser     #
# # # # # # # # # # # # #

# Basic
name:               "MonkeyUser"
description:        "Software development satire"


author:
  name:             Monkey User
  twitter:          ismonkeyuser
  facebook:         ismonkeyuser
  email:            ismonkeyuser@gmail.com
  subtitle:         Brainstorming in progress... see you on Jan 10
  #news:             We migrated to another disqus account. Trying to import old comments - sorry for the inconvenience


# Google-analytics
google-analytics:
  id:               "UA-85826815-1"

# Disqus
disqus:
  id:               "monkeyuser"

# URL
url:                "http://www.monkeyuser.com"
#url:               "localhost:4000"
baseurl:            ""


# http://en.wikipedia.org/wiki/List_of_tz_database_time_zones
timezone:           Europe/Bucharest
permalink:          /:year/:title/

# Pagination
paginate:           5
paginate_path:      /page:num/

# Markdown
markdown:           kramdown
kramdown:
  imput:            GFM

# Navigation
#nav:
#  - name:           "About"
#    url:            "/about"


# Sass
sass:
  sass_dir:         _sass
  style:            :compressed

# Scopes
defaults:
  -
    scope:
      path:         ""
      type:         "pages"
    values:
      layout:       "page"
  -
    scope:
      path:         ""
      type:         "posts"
    values:
      layout:       "post"

# jekyll-seo-tag, see: http://www.rubydoc.info/gems/jekyll-seo-tag/1.2.0
gems:
  - jekyll-seo-tag
  - jekyll-paginate

exclude:            [vendor]
