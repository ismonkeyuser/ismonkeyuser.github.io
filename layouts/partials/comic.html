{{ $dateMachine := .Date | time.Format "2006-01-02T15:04:05-07:00" }}
{{ $dateHuman := .Date | time.Format ":date_long" }}
<div class="comic">
    <a href="{{ .RelPermalink }}?ref=comic"><time datetime="{{ $dateMachine }}">🗓️ {{ $dateHuman }} | <b>{{.Title}}</b></time>
        </a>

    <div class="content">
        {{ .Content }}
    </div>

    {{ with .Params.video }}
    <div class="video-container">
        <div id="{{ . }}"></div>
    </div>
    <script>
        var ytVideo = document.createElement("iframe");
        ytVideo.setAttribute("src", "https://www.youtube.com/embed/{{ . }}");
        document.querySelector("#{{ . }}").append(ytVideo);
    </script>

    {{ end }}

    {{ partial "terms.html" (dict "taxonomy" "tags" "page" .) }}


</div>
