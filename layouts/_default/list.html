{{ define "main" }}
{{ $isSectionRoot := eq .RelPermalink "/tags/" }}
<h1 class="tag">{{ .Title }}</h1>


{{ range .Pages }}
{{ if $isSectionRoot }}
<div class="tags">
  <a class="tag" href="{{ .RelPermalink }}">{{ .LinkTitle }}</a>
</div>
{{ else }}
{{ partial "comic.html" .}}
{{ end }}
{{ end }}

{{ end }}
